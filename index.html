<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Estúdio de Cílios</title>

<style>
body{
margin:0;
font-family:Arial;
background:#fff;
}

header{
background:linear-gradient(135deg,#ffd6e7,#fff);
text-align:center;
padding:70px 20px;
}

h1{
color:#d63384;
font-size:40px;
}

section{
padding:30px;
max-width:500px;
margin:auto;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#d63384;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#c2186a;
}
</style>
</head>

<body>

<header>
<h1>Estúdio de Cílios</h1>
<p>Agendamento profissional 💅</p>
</header>

<section>

<h2>Agendar horário</h2>

<input id="nome" placeholder="Seu nome">
<input id="data" type="date">
<input id="hora" type="time">

<button onclick="agendar()">Agendar</button>

</section>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA6Nqzmul8cl_5uNCLxlQSNMRNJHzAz7Ks",
  authDomain: "cilios-premium.firebaseapp.com",
  projectId: "cilios-premium",
  storageBucket: "cilios-premium.firebasestorage.app",
  messagingSenderId: "1037055186575",
  appId: "1:1037055186575:web:046429d9b765edbfc1c2fa"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// FUNÇÃO DE AGENDAR
window.agendar = async function () {

  const nome = document.getElementById("nome").value;
  const data = document.getElementById("data").value;
  const hora = document.getElementById("hora").value;

  if(!nome || !data || !hora){
    alert("Preencha todos os campos!");
    return;
  }

  await addDoc(collection(db, "agendamentos"), {
    nome,
    data,
    hora
  });

  alert("Agendamento realizado com sucesso 💅");
};

</script>

</body>
</html>
